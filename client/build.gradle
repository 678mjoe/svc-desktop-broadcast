import java.security.MessageDigest
import java.nio.file.Files
import java.nio.file.LinkOption

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.2.0-p4e'
group = 'page.mjoe.svcbroadcast'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories.withType(MavenArtifactRepository).configureEach { repository ->
    if (repository.url.host == 'maven.neoforged.net') {
        repository.url = uri('https://neoforged.forgecdn.net' + repository.url.path)
    }
}

repositories { mavenCentral() }

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
    }
    mods {
        svc_broadcast_sender {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    neoFormTools { canBeConsumed = false }
}

dependencies {
    neoFormTools 'net.neoforged.installertools:binarypatcher:2.1.2:fatjar'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('createMinecraftArtifacts') {
    addArtifactsToManifest(configurations.neoFormTools)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test', Test) { useJUnitPlatform() }

def windowsHelper = providers.gradleProperty('embeddedWindowsHelper').map { file(it) }
def macHelper = providers.gradleProperty('embeddedMacHelper').map { file(it) }
def embeddedResources = layout.buildDirectory.dir('generated/embeddedSender')
def prepareEmbeddedSender = tasks.register('prepareEmbeddedSender') {
    inputs.file(windowsHelper).withPropertyName('windowsHelper').optional().withPathSensitivity(PathSensitivity.NONE)
    inputs.dir(macHelper).withPropertyName('macHelper').optional().withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(embeddedResources)
    doLast {
        def destination = embeddedResources.get().asFile
        project.delete(destination)
        destination.mkdirs()
        def copyHelper = { String platform, Map<String, File> files ->
            def resources = new File(destination, "svc-broadcast/native/${platform}")
            def digest = MessageDigest.getInstance('SHA-256')
            def hashes = files.collect { relative, source ->
                if (!Files.isRegularFile(source.toPath(), LinkOption.NOFOLLOW_LINKS)
                        || source.length() == 0 || source.length() > 8 * 1024 * 1024) {
                    throw new GradleException("Invalid native helper file ${source}")
                }
                byte[] bytes = source.bytes
                def target = new File(resources, relative)
                target.parentFile.mkdirs()
                target.bytes = bytes
                digest.digest(bytes).encodeHex().toString()
            }
            new File(resources, 'SHA256').setText(hashes.join('\n') + '\n', 'US-ASCII')
        }
        if (windowsHelper.isPresent()) {
            copyHelper('windows-x64', ['svc-wasapi-check.exe': windowsHelper.get()])
        }
        if (macHelper.isPresent()) {
            def bundle = macHelper.get()
            def entries = [
                'Contents/MacOS/svc-audio-check', 'Contents/Info.plist', 'Contents/_CodeSignature/CodeResources'
            ]
            copyHelper('macos-arm64', entries.collectEntries { relative ->
                [("SVC Audio Check.app/${relative}".toString()): new File(bundle, relative)]
            })
        }
    }
}

tasks.register('p4eRelease') {
    group = 'build'
    description = 'Builds the dual-platform JAR with both native helper resources.'
    dependsOn tasks.named('build')
    doLast {
        if (!windowsHelper.isPresent() || !macHelper.isPresent()) {
            throw new GradleException('Supply both embeddedWindowsHelper and embeddedMacHelper for a P4E test release.')
        }
    }
}

tasks.named('processResources', ProcessResources) {
    from(prepareEmbeddedSender)
    from('../LICENSE') { into 'META-INF' }
    def metadata = [mod_version: version]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') {
        expand metadata
    }
}
